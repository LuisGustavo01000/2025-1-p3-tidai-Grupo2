services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql

  api:
    build:
      context: ./src/back
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - db
    environment:
      ConnectionStrings__DefaultConnection: Server=db;Port=3306;Database=${MYSQL_DATABASE};User=${MYSQL_USER};Pwd=${MYSQL_PASSWORD}
      Jwt__Key: ${Jwt__Key}
      Cors__AllowedOrigins__0: ${Cors__AllowedOrigins__0}
      Cors__AllowedOrigins__1: ${Cors__AllowedOrigins__1}
      Database__Provider: ${Database__Provider}
    ports:
      - "5284:5284"

volumes:
  mysql-data:
