name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ASPNETCORE_ENVIRONMENT: Testing
      Database__Provider: InMemory
      Jwt__Key: test-jwt-key-for-ci-only-32-chars
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore tests/CashWiseAPI.Tests/CashWiseAPI.Tests.csproj
      - name: Test
        run: dotnet test tests/CashWiseAPI.Tests/CashWiseAPI.Tests.csproj --configuration Release --no-restore
