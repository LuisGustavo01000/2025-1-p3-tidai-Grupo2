<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Alterar Perfil – Cash Wise</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" defer></script> 
  <link rel="stylesheet" href="AlterarU.css" />
  <link rel="stylesheet" href="../css/theme.css" />
  <script src="../js/api.js" defer></script>
  <script src="../js/auth.js" defer></script>
  <script src="AlterarU.js" defer></script>
</head>

<body class="d-flex flex-column min-vh-100">


  <header class="navbar navbar-expand-md navbar-dark px-3">
    <div class="container-fluid">
      <a class="navbar-brand d-flex align-items-center gap-2" href="../Home/Home.html">
        <img src="../../img/LogoCashWiseTransparente2.png" alt="CashWise Logo" width="120" class="img-fluid">
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"
              aria-controls="menu" aria-expanded="false" aria-label="Alternar navegação">
        <span class="navbar-toggler-icon"></span>
      </button>

      <nav id="menu" class="collapse navbar-collapse justify-content-end">
        <ul class="navbar-nav gap-md-2 text-center">
          <li class="nav-item"><a class="nav-link" href="../Perfil Usuario/PerfilU.html">Perfil</a></li>
           <li class="nav-item"><a class="nav-link" href="../Página do Usuario/Usuario.html">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="../Metas Financeiras/Metas.html">Metas</a></li>
          <li class="nav-item"><a class="nav-link" href="../Conteudo/Conteudo.HTML">Blog</a></li>
          <li class="nav-item"><a class="nav-link" href="../Home/Home.html" id="logout-link">Sair</a></li>
        
        </ul>
      </nav>
    </div>
  </header>

 
  <main class="flex-grow-1 py-5">
    <div class="container" style="max-width:700px;">

      <section class="profile-edit bg-light rounded shadow p-4 mb-4">
        <div class="profile-picture text-center mb-4">
          <img id="profileImage" src="../../img/userPlaceholder.png" alt="Foto do usuário">
          <button id="changeImage" type="button" class="btn btn-sm btn-primary mt-2">Alterar imagem ✎</button>
          <input type="file" id="imageInput" accept="image/*" hidden>
          <p class="text-muted small mt-2 mb-0">Pré-visualização local — ainda não é salva no servidor.</p>
        </div>

        <h2 class="h5 mb-3">Dados da conta</h2>

        <div id="dados-feedback" class="alert d-none" role="alert"></div>

        <form id="dados-form">
          <div class="form-group mb-3">
            <label class="form-label fw-bold" for="newName">Nome</label>
            <input type="text" id="newName" name="nome" class="form-control" required>
          </div>

          <div class="form-group mb-3">
            <label class="form-label fw-bold" for="newEmail">E-mail</label>
            <input type="email" id="newEmail" name="email" class="form-control" required>
          </div>

          <button type="submit" class="btn btn-success w-100">Salvar dados</button>
        </form>
      </section>

      <section class="profile-edit bg-light rounded shadow p-4">
        <h2 class="h5 mb-3">Alterar senha</h2>

        <div id="senha-feedback" class="alert d-none" role="alert"></div>

        <form id="senha-form">
          <div class="form-group mb-3">
            <label class="form-label fw-bold" for="currentPassword">Senha atual</label>
            <input type="password" id="currentPassword" name="senhaAtual" class="form-control" required>
          </div>

          <div class="form-group mb-3">
            <label class="form-label fw-bold" for="newPassword">Nova senha</label>
            <input type="password" id="newPassword" name="novaSenha" class="form-control" minlength="8" required>
          </div>

          <div class="form-group mb-4">
            <label class="form-label fw-bold" for="confirmPassword">Confirmar nova senha</label>
            <input type="password" id="confirmPassword" class="form-control" minlength="8" required>
          </div>

          <button type="submit" class="btn btn-success w-100">Alterar senha</button>
        </form>
      </section>

    </div>
  </main>


  <footer class="text-white py-4 mt-auto">
    <div class="container text-center text-md-start">
      <div class="row gy-4">
        <div class="col-12 col-md-4">
          <h4 class="text-success">Links</h4>
          <ul class="list-unstyled">
            <li><a class="text-white text-decoration-none" href="../Home/Home.html">Início</a></li>
            <li><a class="text-white text-decoration-none" href="#">Sobre</a></li>
            <li><a class="text-white text-decoration-none" href="../Conteudo/Conteudo.HTML">Blog</a></li>
            <li><a class="text-white text-decoration-none" href="#">Contato</a></li>
          </ul>
        </div>
        <div class="col-12 col-md-4">
          <h4 class="text-success">Contato</h4>
          <p class="mb-1">E-mail: contato@cashwise.com</p>
          <p>Telefone: (00) 1234-5678</p>
        </div>
        <div class="col-12 col-md-4 d-flex align-items-end">
          <p class="small mb-0">2025 &copy; Cash Wise – TIADAI</p>
        </div>
      </div>
    </div>
  </footer>

</body>
</html>
